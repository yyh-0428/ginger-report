<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍪 微信聊天分析报告 · 一键生成</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
<style>
:root {
  --pg: #f5f0e8; --surface: #fdfaf6; --surface2: #f7f2ea;
  --br900: #3a2a1a; --br700: #8b5e3c; --br500: #c68642; --br300: #d4956a; --br100: #e8d5c0;
  --tl800: #4a7b6f; --tl500: #6faa9c; --tl200: #c4ddd8; --tl050: #ecf5f2;
  --tx900: #2d2018; --tx600: #5a4a3a; --tx400: #8a7a6a;
  --r: 12px; --r2: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  background: var(--pg); color: var(--tx900); line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 800px; margin: 0 auto; padding: 32px 20px; }

/* Header */
.header {
  background: linear-gradient(135deg, var(--br900) 0%, #5a3a28 100%);
  border-radius: 24px; padding: 40px 32px;
  color: #fff; text-align: center; position: relative;
  overflow: hidden; margin-bottom: 20px;
}
.header::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255,255,255,.03) 40px, rgba(255,255,255,.03) 41px);
}
.header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: .04em; position: relative; z-index: 1; }
.header p { opacity: .55; font-size: .88em; margin-top: 8px; position: relative; z-index: 1; }

/* Card */
.card {
  background: var(--surface); border-radius: var(--r2);
  padding: 28px; margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(58,42,26,.06);
}
.card-title {
  font-weight: 700; font-size: 1.05em; color: var(--br900);
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 14px; margin-bottom: 18px;
  border-bottom: 1.5px solid var(--br100);
}

/* Input modes tabs */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; }
.tab {
  padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--br100);
  background: transparent; cursor: pointer; font-size: .82em;
  color: var(--tx600); transition: all .2s; font-family: inherit;
}
.tab:hover { border-color: var(--br300); color: var(--br700); }
.tab.active { background: var(--br700); color: #fff; border-color: var(--br700); }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--br100); border-radius: var(--r);
  padding: 40px 20px; text-align: center; cursor: pointer;
  transition: all .2s; background: var(--surface2);
}
.upload-zone:hover, .upload-zone.drag-over { border-color: var(--br500); background: #fdf3e8; }
.upload-icon { font-size: 2.5rem; margin-bottom: 10px; }
.upload-text { color: var(--br700); font-weight: 600; font-size: .95em; }
.upload-hint { color: var(--tx400); font-size: .78em; margin-top: 6px; }
.upload-file { margin-top: 12px; color: var(--tl800); font-size: .85em; font-weight: 600; }

/* Form fields */
.form-row { display: flex; gap: 14px; margin-bottom: 14px; }
.form-group { flex: 1; }
.form-group label { display: block; font-size: .82em; color: var(--tx600); margin-bottom: 5px; font-weight: 600; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--br100);
  border-radius: var(--r); font-size: .9em; font-family: inherit;
  background: var(--surface2); color: var(--tx900); transition: border .2s;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: var(--br500);
}
.form-group textarea { min-height: 120px; resize: vertical; }

/* AI config collapsible */
.ai-toggle {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: .85em; color: var(--br700); font-weight: 600;
  margin-bottom: 12px; user-select: none;
}
.ai-toggle input { display: none; }
.ai-toggle .switch {
  width: 42px; height: 24px; background: var(--br100); border-radius: 12px;
  position: relative; transition: background .2s;
}
.ai-toggle .switch::after {
  content: ''; position: absolute; width: 20px; height: 20px; background: #fff;
  border-radius: 50%; top: 2px; left: 2px; transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.ai-toggle input:checked + .switch { background: var(--br700); }
.ai-toggle input:checked + .switch::after { transform: translateX(18px); }

.ai-config { display: none; padding: 16px; background: var(--surface2); border-radius: var(--r); margin-bottom: 12px; }
.ai-config.show { display: block; }

/* Button */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 36px; border: none; border-radius: 50px;
  font-size: 1rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all .25s;
  background: linear-gradient(135deg, var(--br700), var(--br500));
  color: #fff; letter-spacing: .03em;
  box-shadow: 0 4px 16px rgba(139,94,60,.25);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(139,94,60,.35); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-secondary { background: transparent; color: var(--br700); border: 2px solid var(--br300); box-shadow: none; }
.btn-secondary:hover { background: var(--br100); }
.btn-center { display: flex; justify-content: center; margin-top: 8px; }

/* Progress */
.progress-wrap { display: none; margin: 20px 0; }
.progress-wrap.show { display: block; }
.progress-bar {
  height: 6px; background: var(--br100); border-radius: 3px; overflow: hidden; margin-bottom: 8px;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--br500), var(--br700));
  border-radius: 3px; width: 0%; transition: width .4s ease;
}
.progress-text { font-size: .82em; color: var(--tx600); }

/* Report container */
.report-wrap { display: none; }
.report-wrap.show { display: block; }
.report-actions {
  display: flex; gap: 10px; justify-content: center;
  padding: 20px; flex-wrap: wrap;
}

/* Report inner styles (for inline display) */
#reportContent { overflow: hidden; }

/* ── OKLCH Design Tokens ──────────────────────────── */
#reportContent {
  --pg:        oklch(93.5% 0.022 55);
  --surface:   oklch(98.5% 0.008 52);
  --surface-2: oklch(96%   0.018 54);
  --br-900: oklch(32%  0.085 48);
  --br-700: oklch(44%  0.095 49);
  --br-500: oklch(58%  0.105 51);
  --br-300: oklch(74%  0.085 53);
  --br-100: oklch(91%  0.042 55);
  --br-050: oklch(96%  0.022 55);
  --tl-800: oklch(40%  0.075 174);
  --tl-500: oklch(58%  0.085 175);
  --tl-200: oklch(83%  0.055 175);
  --tl-050: oklch(95%  0.028 175);
  --tx-900: oklch(22%  0.025 48);
  --tx-600: oklch(46%  0.030 48);
  --tx-400: oklch(63%  0.022 50);
  --sh-sm: 0 1px 4px oklch(32% 0.085 48 / .07);
  --sh-md: 0 4px 18px oklch(32% 0.085 48 / .10);
  --r-sm: 8px;  --r-md: 14px;  --r-lg: 20px;  --r-xl: 28px;
  --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ff-display: 'Songti SC', 'STSong', 'SimSun', Georgia, 'Times New Roman', serif;
  --ff-body:    'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
}

/* ── Animations ───────────────────────────────────── */
#reportContent .header,
#reportContent .stats,
#reportContent .section {
  animation: fadeUpR 560ms var(--ease-expo) both;
  animation-delay: calc(var(--i, 0) * 65ms);
}
#reportContent .bar-fill,
#reportContent .bf-fill-self,
#reportContent .bf-fill-partner {
  animation: growXR 750ms var(--ease-expo) both;
  animation-delay: calc(300ms + var(--bi, 0) * 40ms);
}
#reportContent .bf-fill-self    { transform-origin: right center; }
#reportContent .bf-fill-partner { transform-origin: left center; }
#reportContent .bar-fill        { transform-origin: left center; }

@keyframes fadeUpR {
  from { opacity: 0; transform: translateY(18px); }
}
@keyframes growXR {
  from { transform: scaleX(0); }
}

/* ── Header ────────────────────────────────────────── */
#reportContent .header {
  background: var(--br-900);
  border-radius: var(--r-xl);
  padding: clamp(28px, 5vw, 52px) clamp(22px, 4vw, 48px);
  color: #fff; text-align: center;
  position: relative; overflow: hidden;
  margin-bottom: 14px;
}
#reportContent .header::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg, transparent, transparent 32px, oklch(100% 0 0 / .022) 32px, oklch(100% 0 0 / .022) 33px);
  pointer-events: none;
}
#reportContent .header::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 55%;
  background: linear-gradient(to bottom, transparent, oklch(28% 0.07 48 / .2));
  pointer-events: none;
}
#reportContent .header h1 {
  font-family: var(--ff-display);
  font-size: clamp(1.45rem, 4.5vw, 2.1rem);
  font-weight: 700; letter-spacing: .04em;
  margin-bottom: 7px; position: relative; z-index: 1;
}
#reportContent .header-meta {
  opacity: .58; font-size: .84em; letter-spacing: .03em;
  position: relative; z-index: 1;
}
#reportContent .header-vs {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; margin-top: 20px;
  position: relative; z-index: 1;
}
#reportContent .vs-divider { font-size: .9em; opacity: .38; font-weight: 200; letter-spacing: .2em; }
#reportContent .person-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: oklch(100% 0 0 / .11);
  border: 1px solid oklch(100% 0 0 / .18);
  border-radius: 50px;
  padding: 5px 15px 5px 5px;
}
#reportContent .av {
  width: 38px; height: 38px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
  border: 2px solid oklch(100% 0 0 / .3);
}
#reportContent .av-self    { background: linear-gradient(135deg, var(--br-700), var(--br-300)); color: #fff; }
#reportContent .av-partner { background: linear-gradient(135deg, var(--tl-800), var(--tl-500)); color: #fff; }
#reportContent .pill-name  { font-size: .88em; font-weight: 600; color: #fff; }

/* ── Stats ─────────────────────────────────────────── */
#reportContent .stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 14px;
}
#reportContent .stat {
  background: var(--surface); border-radius: var(--r-md);
  padding: 22px 14px 20px; text-align: center;
  box-shadow: var(--sh-sm); position: relative;
}
#reportContent .stat::after {
  content: ''; position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 3px;
  background: linear-gradient(90deg, var(--br-500), var(--br-300));
  border-radius: 2px 2px 0 0;
}
#reportContent .stat-num {
  font-family: var(--ff-display);
  font-size: clamp(1.5rem, 3.5vw, 2.1rem);
  font-weight: 700; color: var(--br-700);
  line-height: 1; font-variant-numeric: tabular-nums;
}
#reportContent .stat-lbl { color: var(--tx-400); font-size: .78em; margin-top: 7px; }

/* ── Section ───────────────────────────────────────── */
#reportContent .section {
  background: var(--surface); border-radius: var(--r-lg);
  padding: clamp(18px, 3.5vw, 28px);
  box-shadow: var(--sh-sm); margin-bottom: 14px;
}
#reportContent .section-title {
  font-family: var(--ff-display);
  font-size: 1.02em; font-weight: 700;
  color: var(--br-900); letter-spacing: .04em;
  display: flex; align-items: center; gap: 9px;
  padding-bottom: 14px; margin-bottom: 18px;
  border-bottom: 1.5px solid var(--br-100);
}

/* ── Tags ──────────────────────────────────────────── */
#reportContent .tag-self, #reportContent .tag-partner {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 4px;
  border-radius: 20px; font-size: .79em; font-weight: 600;
  white-space: nowrap; color: #fff;
}
#reportContent .tag-self    { background: var(--br-700); }
#reportContent .tag-partner { background: var(--tl-800); }
#reportContent .tag-av {
  width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
  background: oklch(100% 0 0 / .22); color: #fff;
}

/* ── Big5 Butterfly ────────────────────────────────── */
#reportContent .butterfly-header {
  display: grid; grid-template-columns: 1fr 120px 1fr;
  gap: 8px; margin-bottom: 8px;
  font-size: .79em; font-weight: 600; color: var(--tx-400);
}
#reportContent .bf-head-left  { text-align: right; }
#reportContent .bf-head-right { text-align: left; }
#reportContent .butterfly-row {
  display: grid; grid-template-columns: 1fr 120px 1fr;
  gap: 8px; align-items: center; margin: 6px 0;
}
#reportContent .bf-left  { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
#reportContent .bf-right { display: flex; align-items: center; gap: 8px; }
#reportContent .bf-track-left {
  width: 110px; height: 17px;
  background: var(--br-100); border-radius: 8px 0 0 8px;
  overflow: hidden; direction: rtl; flex-shrink: 0;
}
#reportContent .bf-track-right {
  width: 110px; height: 17px;
  background: var(--tl-200); border-radius: 0 8px 8px 0;
  overflow: hidden; flex-shrink: 0;
}
#reportContent .bf-fill-self {
  height: 100%;
  background: linear-gradient(to left, var(--br-900), var(--br-500));
  border-radius: 8px 0 0 8px;
}
#reportContent .bf-fill-partner {
  height: 100%;
  background: linear-gradient(90deg, var(--tl-500), var(--tl-800));
  border-radius: 0 8px 8px 0;
}
#reportContent .bf-score-left {
  font-size: .79em; font-weight: 700; color: var(--br-700);
  text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums;
}
#reportContent .bf-score-right {
  font-size: .79em; font-weight: 700; color: var(--tl-800);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
#reportContent .bf-level  { font-weight: 400; color: var(--tx-400); }
#reportContent .bf-center {
  text-align: center; font-size: .84em; font-weight: 600;
  color: var(--tx-900); line-height: 1.3;
}
#reportContent .bf-center small { font-weight: 400; color: var(--tx-400); font-size: .78em; }

/* ── Big5 dual notes ───────────────────────────────── */
#reportContent .dual-notes {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
  margin-top: 22px; padding-top: 18px;
  border-top: 1.5px solid var(--br-100);
}
#reportContent .note-col-header {
  font-size: .79em; font-weight: 600; color: var(--br-900);
  margin-bottom: 9px; display: flex; align-items: center; gap: 7px;
}
#reportContent .note-item {
  margin-bottom: 9px; padding: 9px 11px;
  background: var(--br-050); border-radius: var(--r-sm);
  border-left: 3px solid var(--br-300);
}
#reportContent .partner-note .note-item { background: var(--tl-050); border-left-color: var(--tl-500); }
#reportContent .note-dim {
  display: inline-block; font-size: .73em; font-weight: 700;
  color: var(--br-700); background: oklch(100% 0 0 / .7);
  padding: 1px 7px; border-radius: 10px; margin-bottom: 3px;
}
#reportContent .partner-note .note-dim { color: var(--tl-800); }
#reportContent .note-text     { font-size: .82em; color: var(--tx-900); display: block; margin-top: 3px; line-height: 1.6; }
#reportContent .note-evidence { font-size: .76em; color: var(--tx-400); font-style: italic; margin-top: 4px; }

/* ── Single Big5 ───────────────────────────────────── */
#reportContent .trait-row {
  display: flex; gap: 14px; margin: 13px 0; align-items: flex-start;
}
#reportContent .trait-label {
  width: 68px; font-weight: 600; font-size: .84em;
  color: var(--tx-900); flex-shrink: 0; line-height: 1.3; padding-top: 2px;
}
#reportContent .trait-label small { font-weight: 400; color: var(--tx-400); display: block; }
#reportContent .trait-body { flex: 1; }
#reportContent .bar-wrap { display: flex; align-items: center; gap: 10px; }
#reportContent .bar-track {
  flex: 1; height: 17px;
  background: var(--br-100); border-radius: 8px; overflow: hidden;
}
#reportContent .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--br-300), var(--br-900));
  border-radius: 8px;
}
#reportContent .bar-score {
  font-size: .79em; color: var(--br-700); font-weight: 700;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
#reportContent .trait-note     { font-size: .82em; color: var(--tx-600); margin-top: 6px; line-height: 1.65; }
#reportContent .trait-evidence { font-size: .76em; color: var(--tx-400); font-style: italic; margin-top: 3px; }

/* ── MBTI ──────────────────────────────────────────── */
#reportContent .dual-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
#reportContent .person-panel {
  border-radius: var(--r-md); padding: 18px;
  background: var(--br-050);
}
#reportContent .person-panel.panel-partner { background: var(--tl-050); }
#reportContent .panel-header { margin-bottom: 10px; }
#reportContent .mbti-type-badge {
  font-family: var(--ff-display);
  font-size: clamp(1.8rem, 4vw, 2.7rem);
  font-weight: 700; letter-spacing: 5px;
  color: var(--br-700); line-height: 1; margin: 8px 0 4px;
}
#reportContent .mbti-type-badge.panel-partner { color: var(--tl-800); }
#reportContent .mbti-conf  { font-size: .77em; color: var(--tx-400); margin-top: 2px; }
#reportContent .mbti-note  { font-size: .81em; color: var(--tx-600); margin: 8px 0 10px; font-style: italic; line-height: 1.55; }
#reportContent .dim-row {
  display: grid; grid-template-columns: 74px 26px 48px 1fr;
  gap: 6px; padding: 6px 0;
  border-bottom: 1px solid oklch(100% 0 0 / .55);
  align-items: baseline; font-size: .81em;
}
#reportContent .panel-partner .dim-row { border-bottom-color: oklch(100% 0 0 / .45); }
#reportContent .dim-axis     { color: var(--tx-900); font-weight: 600; }
#reportContent .dim-lean     { font-weight: 800; color: var(--br-500); }
#reportContent .dim-lean.panel-partner { color: var(--tl-800); }
#reportContent .dim-strength { color: var(--tx-400); font-size: .84em; }
#reportContent .dim-reason   { color: var(--tx-600); line-height: 1.45; }

/* ── Style Summary ─────────────────────────────────── */
#reportContent .one-line {
  background: var(--surface-2);
  border-left: 4px solid var(--br-500);
  padding: 13px 18px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: .94em; font-style: italic; color: var(--tx-900);
  margin-bottom: 15px; line-height: 1.7;
}
#reportContent .one-line.partner { border-left-color: var(--tl-500); background: var(--tl-050); }
#reportContent .summary-text { font-size: .89em; color: var(--tx-600); line-height: 1.8; margin-bottom: 13px; }
#reportContent .strengths    { padding-left: 18px; margin-bottom: 13px; }
#reportContent .strengths li { font-size: .87em; color: var(--tx-600); margin: 6px 0; line-height: 1.6; }
#reportContent .fun-facts-label { font-size: .82em; font-weight: 700; color: var(--br-500); margin: 13px 0 7px; }
#reportContent .partner-col .fun-facts-label { color: var(--tl-800); }
#reportContent .fun-fact {
  background: var(--surface-2);
  border-left: 3px solid var(--br-300);
  padding: 10px 14px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: .84em; margin: 7px 0; color: var(--tx-600); line-height: 1.65;
}
#reportContent .partner-col .fun-fact { border-left-color: var(--tl-500); }

/* ── Heatmap ───────────────────────────────────────── */
#reportContent .hm-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
#reportContent .hm-label-sm { font-size: .79em; color: var(--tx-400); }
#reportContent .hm-yr-btns  { display: flex; gap: 5px; flex-wrap: wrap; }
#reportContent .hm-yr-btn {
  padding: 4px 13px; border-radius: 20px;
  border: 1.5px solid var(--br-300);
  background: transparent; color: var(--br-700);
  cursor: pointer; font-size: .79em; font-family: inherit;
  transition: background 150ms, color 150ms, border-color 150ms;
}
#reportContent .hm-yr-btn.hm-active { background: var(--br-700); color: #fff; border-color: var(--br-700); }
#reportContent .hm-yr-btn:hover:not(.hm-active) { background: var(--br-100); }
#reportContent .hm-person-block { margin-bottom: 18px; }
#reportContent .hm-person-label { margin-bottom: 9px; }
#reportContent .hm-flex         { display: flex; gap: 4px; }
#reportContent .hm-daycol       { display: flex; flex-direction: column; flex-shrink: 0; }
#reportContent .hm-month-sp     { height: 18px; }
#reportContent .hm-daylbl {
  height: 14px; width: 18px; font-size: 9px;
  color: var(--tx-400); line-height: 14px; margin-bottom: 2px; text-align: right;
}
#reportContent .hm-scroll {
  display: flex; gap: 2px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin; scrollbar-color: var(--br-300) var(--br-100);
}
#reportContent .hm-scroll::-webkit-scrollbar       { height: 5px; }
#reportContent .hm-scroll::-webkit-scrollbar-track { background: var(--br-100); border-radius: 3px; }
#reportContent .hm-scroll::-webkit-scrollbar-thumb { background: var(--br-300); border-radius: 3px; }
#reportContent .hm-col     { display: flex; flex-direction: column; }
#reportContent .hm-monlbl  { height: 18px; font-size: 9px; color: var(--tx-400); white-space: nowrap; }
#reportContent .hm-weekcol { display: flex; flex-direction: column; gap: 2px; }
#reportContent .hm-cell {
  width: 13px; height: 13px; border-radius: 2px;
  flex-shrink: 0; transition: opacity 100ms; cursor: default;
}
#reportContent .hm-cell:hover { opacity: .62; }
#reportContent .hm-out   { background: transparent !important; }
#reportContent .hm-sep   { border: none; border-top: 1.5px solid var(--br-100); margin: 14px 0; }
#reportContent .hm-legend { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; font-size: .75em; color: var(--tx-400); }
#reportContent .hm-leg-row   { display: flex; align-items: center; gap: 5px; }
#reportContent .hm-leg-cells { display: flex; gap: 2px; }
#reportContent .hm-leg-cell  { width: 11px; height: 11px; border-radius: 2px; }
#reportContent .hm-tip {
  position: fixed; background: var(--tx-900); color: oklch(96% 0.022 55);
  padding: 6px 12px; border-radius: var(--r-sm);
  font-size: 11px; pointer-events: none; z-index: 9999;
  display: none; white-space: nowrap; line-height: 1.5;
  box-shadow: 0 4px 14px oklch(22% 0.025 48 / .28);
}

/* ── Charts grid ───────────────────────────────────── */
#reportContent .chart-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
#reportContent .chart-grid .chart-cell {
  height: 280px; border-radius: var(--r-sm);
}
#reportContent .chart-grid .chart-cell-full {
  height: 320px; border-radius: var(--r-sm);
}

/* ── Disclaimer ────────────────────────────────────── */
#reportContent .disc {
  text-align: center; font-size: .74em; color: var(--tx-400);
  padding: 26px 22px; border-top: 1.5px solid var(--br-100);
  line-height: 2;
}
#reportContent .brand {
  font-family: var(--ff-display);
  font-weight: 700; color: var(--br-500);
  margin-top: 12px; font-size: 1em; letter-spacing: .08em;
}

/* ── Responsive ────────────────────────────────────── */
@media (max-width: 600px) {
  #reportContent .chart-grid       { grid-template-columns: 1fr; }
  #reportContent .dual-col         { grid-template-columns: 1fr; }
  #reportContent .dual-notes       { grid-template-columns: 1fr; }
  #reportContent .stats            { gap: 7px; }
  #reportContent .stat-num         { font-size: 1.4rem; }
  #reportContent .butterfly-row,
  #reportContent .butterfly-header { grid-template-columns: 1fr 80px 1fr; }
  #reportContent .bf-track-left,
  #reportContent .bf-track-right   { width: 72px; }
  #reportContent .mbti-type-badge  { font-size: 1.75rem; letter-spacing: 3px; }
}

/* Manual input helper */
.manual-hint { font-size: .78em; color: var(--tx400); margin-top: 6px; }
.msg-entry { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.msg-entry select { padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--br100); background: var(--surface2); font-size: .85em; }
.msg-entry input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--br100); background: var(--surface2); font-size: .85em; }
.msg-entry button { padding: 6px 12px; border: none; border-radius: 8px; background: var(--br100); cursor: pointer; font-size: .85em; color: var(--br700); }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--br900); color: #fff; padding: 12px 24px;
  border-radius: 50px; font-size: .9em; z-index: 999;
  opacity: 0; transition: opacity .3s;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  .container { padding: 16px 12px; }
  .header { padding: 28px 20px; }
  .header h1 { font-size: 1.4rem; }
  .card { padding: 20px; }
  .form-row { flex-direction: column; gap: 10px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🍪 微信聊天分析报告</h1>
    <p>上传聊天记录 → 一键生成精美人格分析报告</p>
  </div>

  <!-- Input Section -->
  <div class="card" id="inputCard">
    <div class="card-title">📂 输入聊天数据</div>

    <div class="tabs" id="inputTabs">
      <button class="tab active" data-mode="csv">📊 CSV</button>
      <button class="tab" data-mode="json">📋 JSON</button>
      <button class="tab" data-mode="txt">📝 TXT</button>
      <button class="tab" data-mode="md">📑 Markdown</button>
      <button class="tab" data-mode="manual">✍️ 手动输入</button>
    </div>

    <div id="uploadPanel">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击上传或拖拽文件到此处</div>
        <div class="upload-hint" id="uploadHint">支持 CSV / JSON / TXT / Markdown 格式</div>
        <div class="upload-file" id="uploadFileName"></div>
      </div>
      <input type="file" id="fileInput" style="display:none" accept=".csv,.json,.txt,.md,.markdown">
    </div>

    <div id="manualPanel" style="display:none">
      <div id="msgEntries"></div>
      <button class="btn btn-secondary" style="margin-top:10px;padding:8px 20px;font-size:.85em" onclick="addMsgEntry()">+ 添加消息</button>
      <div class="manual-hint">每条消息选择一个发送者（自己/对方），输入消息内容。至少需要 5 条消息。</div>
    </div>

    <div style="margin-top:18px">
      <div class="form-row">
        <div class="form-group">
          <label>🙋 你的名字</label>
          <input type="text" id="selfName" placeholder="例如：小明" value="我">
        </div>
        <div class="form-group">
          <label>💬 对方的名字</label>
          <input type="text" id="partnerName" placeholder="例如：小红" value="对方">
        </div>
      </div>
    </div>
  </div>

  <!-- AI Config -->
  <div class="card">
    <div class="card-title">🤖 AI 人格分析（可选）</div>
    <label class="ai-toggle">
      <input type="checkbox" id="aiEnabled" onchange="toggleAI()">
      <span class="switch"></span>
      启用 AI 人格分析（需要 API Key）
    </label>
    <div class="ai-config" id="aiConfig">
      <div class="form-row">
        <div class="form-group">
          <label>API 端点</label>
          <input type="text" id="apiEndpoint" value="https://api.openai.com/v1/chat/completions" placeholder="https://api.openai.com/v1/chat/completions">
        </div>
        <div class="form-group">
          <label>模型名称</label>
          <input type="text" id="apiModel" value="gpt-4o" placeholder="gpt-4o / deepseek-chat / claude-3-opus">
        </div>
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
      <div class="manual-hint">
        支持所有 OpenAI 兼容接口：OpenAI / DeepSeek / 智谱 / 通义千问 / Moonshot / Claude API 等。
        API Key 仅保存在浏览器本地，不会上传到任何服务器。
      </div>
    </div>
  </div>

  <!-- Generate Button -->
  <div class="btn-center">
    <button class="btn" id="generateBtn" onclick="generateReport()">🍪 一键生成报告</button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">准备中...</div>
  </div>

  <!-- Report Area -->
  <div class="report-wrap" id="reportWrap">
    <div class="report-actions">
      <button class="btn btn-secondary" onclick="downloadReport()">💾 下载 HTML 报告</button>
      <button class="btn btn-secondary" onclick="scrollToTop()">⬆ 回到顶部</button>
    </div>
    <div class="card" id="reportContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
